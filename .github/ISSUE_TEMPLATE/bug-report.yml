name: Bug Report
description: Report a bug in zedom
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Steps to reproduce the behavior
      placeholder: |
        1. Import '...'
        2. Call '...'
        3. See error
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      description: zedom version
      placeholder: 0.1.0-alpha.2
  - type: dropdown
    attributes:
      label: Environment
      options:
        - Browser
        - Node.js
        - Both
