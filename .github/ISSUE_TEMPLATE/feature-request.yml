name: Feature Request
description: Suggest a new feature for zedom
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Description
      description: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Use Case
      description: How would this feature be used?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed API
      description: Example code showing how the API could look
      render: typescript
